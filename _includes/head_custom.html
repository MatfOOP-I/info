<script>
  // Превод поруке претраге коју тема исписује на енглеском.
  document.addEventListener('DOMContentLoaded', function () {
    var results = document.getElementById('search-results');
    if (!results) return;
    new MutationObserver(function () {
      var none = results.querySelector('.search-no-result');
      if (none && none.textContent === 'No results found') none.textContent = 'Нема резултата';
    }).observe(results, { childList: true, subtree: true });
  });
</script>
<script>
  // Спољни линкови и PDF документи се отварају у новом табу
  // (уместо {:target="_blank"} у сваком .md фајлу).
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.main-content a[href]').forEach(function (a) {
      var external = a.hostname && a.hostname !== location.hostname;
      if (external || /\.pdf$/i.test(a.pathname)) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
    });
  });
</script>
